[project]
name = "awale"
version = "0.1.0"
description = "Awalé on your computer: play people or AI, and build AI agents."
requires-python = ">=3.11"
# OpenSpiel is our reference for the rules (in the tests), and its agents are outside opponents.
dependencies = ["pygame>=2.5", "open_spiel"]

[project.optional-dependencies]
# Only needed to run the tests.
dev = ["pytest"]

[project.scripts]
awale = "awale.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["awale", "awale.agents", "awale.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
